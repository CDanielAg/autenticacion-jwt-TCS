<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Autenticación JWT</title>
  <link rel="stylesheet" href="/style.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <main>
    <header>
      <h1>Autenticación JWT</h1>
      <p>Inicia sesión y comprueba cómo el token Bearer habilita el acceso al perfil.</p>
    </header>
    <div class="panels">
      <section>
        <h2>Iniciar sesión</h2>
        <code>POST /api/auth/login</code>
        <form>
          <label for="email">Correo electrónico</label>
          <input id="email" name="email" type="email" autocomplete="username" value="demo@example.com" required>
          <label for="password">Contraseña</label>
          <input id="password" name="password" type="password" autocomplete="current-password" required>
          <button type="submit">Iniciar sesión</button>
        </form>
        <p id="login-result" class="result" role="status">Ingresa la contraseña de la cuenta de prueba.</p>
      </section>
      <section>
        <h2>Perfil protegido</h2>
        <code>GET /api/profile</code>
        <div class="actions">
          <button id="profile" type="button" disabled>Consultar con Bearer</button>
          <button id="anonymous" class="secondary" type="button">Probar sin token</button>
        </div>
        <p id="profile-result" class="result" role="status">Consulta el perfil para ver la respuesta de la API.</p>
      </section>
    </div>
  </main>
</body>
</html>
